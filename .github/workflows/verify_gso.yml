name: GSO Firmalari Web Sitesi Dogrulama ve Havuz Aktarimi

on:
  workflow_dispatch:

jobs:
  verify-gso:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: GSO Web Sitesi Dogrulamasini Calistir
        run: |
          echo "🚀 GSO Sanayi Odasi Uye Dogrulamasi Baslatiliyor..."
          node scraper/verify_gso.js

      - name: Dogrulanmis Verileri Repoya Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add portal/leads_manual.json
          git diff --staged --quiet || git commit -m "feat: add verified website-free leads from GSO [skip ci]"
          git pull --rebase origin main
          git push origin main
