name: Firmaseç Bulut Veri Toplama

on:
  workflow_dispatch:
    inputs:
      target_leads:
        description: 'Toplanacak Hedef Firma Sayısı'
        required: true
        default: '2500'

jobs:
  scrape-firmasec:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bulutta Firmaseç Taramasını Çalıştır
        env:
          TARGET_LEADS: ${{ github.event.inputs.target_leads || '2500' }}
        run: |
          echo "🚀 Bulut sunucusu baslatildi..."
          echo "Hedef: $TARGET_LEADS yeni web sitesiz firma"
          node scraper/fetch_firmasec.js

      - name: Yeni Verileri Repoya Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add portal/leads_manual.json
          git diff --staged --quiet || git commit -m "feat: add batch of website-free leads from firmasec [skip ci]"
          git pull --rebase origin main
          git push origin main
