      # --- WORKER 8: Güneydoğu ---
      - name: "W8 - Güneydoğu Anadolu"
        run: cd scraper && node worker_scrape.js --worker=8 || true

      - name: "Deploy W8"
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto: W8 Güneydoğu [skip ci]" || echo "Yeni veri yok"
