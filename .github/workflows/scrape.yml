      # --- WORKER 11: İç Anadolu ---
      - name: "W11 - İç Anadolu"
        run: cd scraper && node worker_scrape.js --worker=11 || true

      - name: "Deploy W11"
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto: W11 İç Anadolu [skip ci]" || echo "Yeni veri yok"
          git push

      - name: "CF Deploy W11"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # --- WORKER 12: Doğu Anadolu ---
      - name: "W12 - Doğu Anadolu"
        run: cd scraper && node worker_scrape.js --worker=12 || true

      - name: "Deploy W12 (Final)"
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto: W12 Doğu Anadolu - Döngü tamamlandı [skip ci]" || echo "Yeni veri yok"
          git push

      - name: "CF Deploy W12 (Final)"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # --- DÖNGÜYÜ YENİDEN BAŞLAT ---
      - name: "Yeni Döngüyü Hemen Başlat"
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/OBLabs2026/oblabs-telesatis/actions/workflows/scrape.yml/dispatches \
            -d '{"ref":"main","inputs":{"worker":"all"}}'
          echo "Yeni döngü başlatıldı! Türkiye turuna devam..."
