name: Otomatik Lead Toplama & Deploy (Cloud Scraping)

on:
  schedule:
    # Her 4 saatte bir otomatik çalışır
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # GitHub arayüzünden tek tıkla "Run workflow" diyerek elle de başlatılabilir
    inputs:
      worker:
        description: 'Çalıştırılacak Worker Numarası (1-6 veya all)'
        required: false
        default: 'all'

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Kur
        run: |
          cd scraper
          npm install

      - name: Chromium / Chrome Kur
        run: |
          cd scraper
          npx puppeteer browsers install chrome

      - name: Tarayıcıyı Çalıştır (Scraping)
        run: |
          cd scraper
          # Eğer elle belirli worker seçildiyse onu çalıştır, yoksa sırayla 1, 2, 3, 4, 5, 6 tara
          if [ "${{ github.event.inputs.worker }}" != "" ] && [ "${{ github.event.inputs.worker }}" != "all" ]; then
            echo "Tek Worker Çalışıyor: ${{ github.event.inputs.worker }}"
            node worker_scrape.js --worker=${{ github.event.inputs.worker }}
          else
            echo "Tüm Workerlar Sırayla Çalışıyor..."
            node worker_scrape.js --worker=1 || true
            node worker_scrape.js --worker=2 || true
            node worker_scrape.js --worker=3 || true
            node worker_scrape.js --worker=4 || true
            node worker_scrape.js --worker=5 || true
            node worker_scrape.js --worker=6 || true
          fi

      - name: Verileri Portala Senkronize Et
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json

      - name: Yeni Verileri GitHub Reposuna Kaydet (Commit & Push)
        run: |
          git config --global user.name "OB Labs Bot"
          git config --global user.email "bot@oblabs.com.tr"
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto-scrape: Yeni toplanan firmalar eklendi [skip ci]" || echo "Yeni veri yok"
          git push

      - name: Cloudflare Pages / Worker Deploy (data.oblabs.com.tr)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
