name: OB Labs Bulut Otomasyonu (Guvenli 2x Worker)

on:
  schedule:
    # Her 30 dakikada bir otomatik çalış
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  cloud-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        worker: [1, 2]

    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v4

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NPM Paketlerini Kur
        run: cd scraper && npm install

      - name: Chrome Tarayıcısını Kur
        run: cd scraper && npx puppeteer browsers install chrome

      - name: Bulut Motoru Calistir
        env:
          SUPABASE_URL: https://sxvlvvcgkrbjktflroqu.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scraper
          if [ "${{ matrix.worker }}" = "1" ]; then
            echo "🚀 Motor #1: Sanayi ve Ticaret Merkezleri Baslatiliyor..."
            node worker_scrape.js --worker=1
          else
            echo "🏖️ Motor #2: Turizm, Butik Otel, Bungalov ve Turlar Baslatiliyor..."
            node worker_tourism.js
          fi
