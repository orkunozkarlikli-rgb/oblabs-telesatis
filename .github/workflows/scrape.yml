name: OB Labs Bulut Otomasyonu (4x Turbo Kesintisiz Dongu)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  cloud-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [1, 2, 3, 4]

    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v4

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NPM Paketlerini Kur
        run: cd scraper && npm install

      - name: Chrome Tarayıcısını Kur
        run: cd scraper && npx puppeteer browsers install chrome

      - name: Bulut Motoru Calistir
        env:
          SUPABASE_URL: https://sxvlvvcgkrbjktflroqu.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scraper
          if [ "${{ matrix.worker }}" = "1" ]; then
            echo "🚀 Motor #1: İç Anadolu & Başkent (Ankara, OSTİM, Konya, Kayseri, Denizli)..."
            node worker_scrape.js --worker=1
          elif [ "${{ matrix.worker }}" = "2" ]; then
            echo "🌊 Motor #2: Ege & Akdeniz (İzmir, Bursa, Antalya, Alanya, Adana, Mersin)..."
            node worker_scrape.js --worker=2
          elif [ "${{ matrix.worker }}" = "3" ]; then
            echo "🏭 Motor #3: Güneydoğu & Doğu (Gaziantep, Şanlıurfa, K.Maraş, Diyarbakır, Erzurum)..."
            node worker_scrape.js --worker=3
          else
            echo "🌲 Motor #4: Karadeniz, Artvin & Bungalov / Butik Otel Turizm Motoru..."
            node worker_tourism.js
          fi

  trigger-next-cycle:
    needs: cloud-scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Kesintisiz Döngü (Bir Sonraki Turu Otomatik Başlat)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "🚀 Mevcut tur tamamlandı. 30 saniye sonra yeni tur tetikleniyor..."
          sleep 30
          curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/orkunozkarlikli-rgb/oblabs-telesatis/actions/workflows/scrape.yml/dispatches \
            -d '{"ref":"main"}'
