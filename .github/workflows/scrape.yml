        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # --- WORKER 5: İzmir ---
      - name: "W5 - İzmir"
        run: cd scraper && node worker_scrape.js --worker=5 || true

      - name: "Deploy W5"
        run: |
