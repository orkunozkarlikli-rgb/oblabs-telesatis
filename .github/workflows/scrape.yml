name: Otomatik Lead Toplama & Deploy (Cloud Scraping)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker Numarası (1-12 veya all)'
        required: false
        default: 'all'

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Kur
        run: cd scraper && npm install

      - name: Chromium / Chrome Kur
        run: cd scraper && npx puppeteer browsers install chrome

      # --- WORKER 1: İstanbul Anadolu ---
      - name: "W1 - İstanbul Anadolu"
        run: cd scraper && node worker_scrape.js --worker=1 || true

      - name: "Deploy W1"
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git config --global user.name "OB Labs Bot"
          git config --global user.email "bot@oblabs.com.tr"
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto: W1 İstanbul Anadolu [skip ci]" || echo "Yeni veri yok"
          git push

      - name: "CF Deploy W1"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # --- WORKER 2: İstanbul Avrupa Merkez ---
      - name: "W2 - İstanbul Avrupa Merkez"
        run: cd scraper && node worker_scrape.js --worker=2 || true

      - name: "Deploy W2"
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto: W2 İstanbul Avrupa Merkez [skip ci]" || echo "Yeni veri yok"
          git push

      - name: "CF Deploy W2"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # --- WORKER 3: İstanbul Avrupa Sanayi ---
      - name: "W3 - İstanbul Avrupa Sanayi"
        run: cd scraper && node worker_scrape.js --worker=3 || true

      - name: "Deploy W3"
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto: W3 İstanbul Avrupa Sanayi [skip ci]" || echo "Yeni veri yok"
          git push

      - name: "CF Deploy W3"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # --- WORKER 4: Ankara ---
      - name: "W4 - Ankara"
        run: cd scraper && node worker_scrape.js --worker=4 || true

      - name: "Deploy W4"
        run: |
          cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto: W4 Ankara [skip ci]" || echo "Yeni veri yok"
          git push

      - name: "CF Deploy W4"
