name: Otomatik Lead Toplama & Deploy (Cloud Scraping)

on:
  schedule:
    # Yedek: Her 2 saatte bir (workflow kendini zaten tetikliyor ama güvenlik için)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker Numarası (1-6 veya all)'
        required: false
        default: 'all'

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Kur
        run: |
          cd scraper
          npm install

      - name: Chromium / Chrome Kur
        run: |
          cd scraper
          npx puppeteer browsers install chrome

      - name: Tarayıcıyı Çalıştır (Scraping)
        run: |
          cd scraper
          echo "Tüm Workerlar Sırayla Çalışıyor..."
          node worker_scrape.js --worker=1 || true
          node worker_scrape.js --worker=2 || true
          node worker_scrape.js --worker=3 || true
          node worker_scrape.js --worker=4 || true
          node worker_scrape.js --worker=5 || true
          node worker_scrape.js --worker=6 || true

      - name: Verileri Portala Senkronize Et
        run: cp scraper/output/turkiye_websiz_leadler.json portal/leads_data.json

      - name: Yeni Verileri GitHub Reposuna Kaydet (Commit & Push)
        run: |
          git config --global user.name "OB Labs Bot"
          git config --global user.email "bot@oblabs.com.tr"
          git add scraper/output/turkiye_websiz_leadler.json portal/leads_data.json
          git commit -m "Auto-scrape: Yeni toplanan firmalar eklendi [skip ci]" || echo "Yeni veri yok"
          git push

      - name: Cloudflare Deploy (data.oblabs.com.tr)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: 1 Dakika Bekle
        run: |
          echo "Deploy tamamlandi! 1 dakika bekleniyor..."
          sleep 60

      - name: Yeni Döngüyü Başlat (Kendini Tetikle)
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/OBLabs2026/oblabs-telesatis/actions/workflows/scrape.yml/dispatches \
            -d '{"ref":"main","inputs":{"worker":"all"}}'
          echo "Yeni scraping dönüsü baslatildi!"
