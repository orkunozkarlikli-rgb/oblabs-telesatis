name: OB Labs Bulut Otomasyonu (4x Turbo - 500 Ilce)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  cloud-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [1, 2, 3, 4]

    steps:
      - name: Proje Kodlarini Cek
        uses: actions/checkout@v4

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NPM Paketlerini Kur
        run: cd scraper && npm install

      - name: Chrome Tarayicisini Kur
        run: cd scraper && npx puppeteer browsers install chrome

      - name: Bulut Motoru Calistir
        env:
          SUPABASE_URL: https://sxvlvvcgkrbjktflroqu.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scraper
          echo "🚀 Motor #${{ matrix.worker }} basliyor - 500+ ilce listesinden taze bolgeler..."
          node worker_scrape.js --worker=${{ matrix.worker }}

  trigger-next-cycle:
    needs: cloud-scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kesintisiz Dongu
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Mevcut tur tamamlandi. 30 saniye sonra yeni tur basliyor..."
          sleep 30
          curl -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/orkunozkarlikli-rgb/oblabs-telesatis/actions/workflows/scrape.yml/dispatches \
            -d '{"ref":"main"}'
